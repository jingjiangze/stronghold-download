name: deploy

# push 到 master 或手动 dispatch：先跑测试，再用 wrangler 部署并存 Worker。
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   —— 「Edit Cloudflare Workers」模板即可
#   CLOUDFLARE_ACCOUNT_ID  —— CF 控制台右侧的 Account ID
# 未配置 token 时自动跳过部署（只跑测试），配置后即刻生效——无需改 workflow。
#
# 注意：wrangler.toml 里的 name/sp-lobby-board 与路由/DO 迁移是**线上既有身份**——
# 本仓部署即原地更新同一 Worker（DO 数据、自定义域、workers.dev 兜底都不受影响）。
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests before deploy
        run: node --test

      - name: Skip when no Cloudflare token is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN 未配置 — 跳过自动部署。在 Settings → Secrets and variables → Actions 添加 CLOUDFLARE_API_TOKEN 与 CLOUDFLARE_ACCOUNT_ID 后，本 workflow 将自动部署。"

      - name: Deploy (wrangler)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 deploy

      - name: Post-deploy health check
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          for try in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "https://sp-lobby.jiangjiangze.icu/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "health: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::post-deploy health check failed (last HTTP $code)"; exit 1
