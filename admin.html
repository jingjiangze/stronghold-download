<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f0e" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="卫戍协议：盟约 · 服务器清单管理" />
  <title>卫戍协议：盟约 · 清单管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230c0f0e'/%3E%3Cpath fill='%234ed8af' d='M5 3h3v2h2V3h4v2h2V3h3v5l-2 2v7l2 2v2H5v-2l2-2v-7L5 8z'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="./fonts/fonts.css" />
  <link rel="stylesheet" href="./css/theme.css?v=8" />
  <link rel="stylesheet" href="./css/components.css?v=8" />
  <link rel="stylesheet" href="./css/screens/title.css?v=8" />
  <link rel="stylesheet" href="./css/devices.css?v=8" />
  <link rel="stylesheet" href="./css/dl.css?v=8" />
  <link rel="stylesheet" href="./css/servers.css?v=23" />
  <link rel="stylesheet" href="./css/admin.css?v=8" />
</head>
<body>
  <div class="screen title-screen servers-screen">
    <div class="title-bg" aria-hidden="true">
      <div class="title-bg__glow"></div>
      <div class="title-bg__radar"><div class="title-bg__sweep"></div></div>
      <div class="title-bg__target"></div>
      <svg class="title-bg__ridges" viewBox="0 0 1920 420" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="ridge-far" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16231f" /><stop offset="1" stop-color="#0a0e0d" />
          </linearGradient>
          <linearGradient id="ridge-near" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0f1714" /><stop offset=".6" stop-color="#080b0a" />
          </linearGradient>
          <linearGradient id="ridge-edge" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#17f9b7" stop-opacity="0" />
            <stop offset=".3" stop-color="#17f9b7" stop-opacity=".55" />
            <stop offset=".7" stop-color="#17f9b7" stop-opacity=".55" />
            <stop offset="1" stop-color="#17f9b7" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path class="ridge ridge--far" fill="url(#ridge-far)" stroke="url(#ridge-edge)"
          d="M0 420V250l120-40 90 30 90-70 60 20 80-70 80 55 80-25 90 70 90-20 80 50 100-15 90 25 90-55 90-55 70-55 70 45 80-20 90 65 80-20 100 55 100-20 100 40v180z" />
        <path class="ridge ridge--near" fill="url(#ridge-near)" stroke="url(#ridge-edge)"
          d="M0 420V322l160-32 100 20 120-50 90 40 130-20 120 50 140-30 140 35 120-35 140 20 140-50 120 30 120-20 120 40 160-20v147z" />
      </svg>
      <div class="title-bg__haze"></div>
      <span class="cross" style="left:7%;top:22%"></span>
      <span class="cross" style="left:93%;top:30%"></span>
      <span class="cross" style="left:14%;top:70%"></span>
      <span class="cross" style="left:88%;top:62%"></span>
      <span class="cross" style="left:60%;top:12%"></span>
    </div>

    <div class="title-corner title-corner--tl">
      <span class="title-corner__mark"></span>
      <div><span class="micro micro--mint">RHODES ISLAND // SIMULATION SERVICE</span><br /><span class="micro">TACTICAL CO-OP NODE · 02</span></div>
    </div>
    <div class="title-corner title-corner--tr">
      <span class="micro micro--hi">NETWORK STATUS</span><br /><span class="micro">LIST ADMIN</span>
    </div>

    <main class="title-main servers-main">
      <div class="title-en">
        <span class="title-en__a">STRONGHOLD PROTOCOL</span>
        <span class="title-en__b">LIST ADMIN</span>
      </div>
      <h1 class="title-cn">清单管理</h1>
      <p class="title-tag">输入密钥后可管理全部服务器</p>

      <div class="title-login servers-panel admin-panel" id="ad-gate" hidden>
        <div class="servers-head">
          <span class="micro micro--mint" id="ad-status"></span>
          <a class="btn btn--secondary btn--sm" href="./servers.html"><span class="btn__label">返回清单</span></a>
        </div>

        <div class="admin-list" id="ad-list"></div>

        <div class="admin-review" id="ad-review" hidden>
          <div class="servers-head">
            <span class="micro micro--mint">未通过校验（暂存区）</span>
            <button type="button" class="btn btn--ghost btn--sm" id="ad-reload"><span class="btn__label">刷新</span></button>
          </div>
          <div class="admin-list" id="ad-pending"></div>
        </div>

        <form class="admin-form" id="ad-form" autocomplete="off">
          <div class="admin-grid">
            <label class="admin-field">
              <span class="micro">名称</span>
              <input id="ad-name" maxlength="24" placeholder="例：腾讯云测试服" required />
            </label>
            <label class="admin-field">
              <span class="micro">地址</span>
              <input id="ad-url" inputmode="url" placeholder="http://106.55.43.13:3000 或 https://host" required />
            </label>
            <label class="admin-field">
              <span class="micro">探针路径</span>
              <input id="ad-probe" placeholder="/healthz" value="/healthz" />
            </label>
            <label class="admin-field">
              <span class="micro">备注</span>
              <input id="ad-note" maxlength="24" placeholder="可选" />
            </label>
          </div>
          <p class="admin-err" id="ad-err" hidden></p>
          <div class="admin-actions">
            <button type="submit" class="btn btn--primary btn--sm" id="ad-submit"><span class="btn__label">校验并添加</span></button>
            <a class="btn btn--secondary btn--sm" href="./servers.html"><span class="btn__label">查看清单</span></a>
          </div>
        </form>

        <p class="dl-note" id="ad-note">提交由服务端实测 /healthz：确认是卫戍协议服务器即自动加入公共清单。
          停用/删除直接写线上清单；暂存区的服务器恢复 = 重新加入清单。</p>
        <p class="dl-links">
          <a href="./index.html">下载客户端</a>
          <span class="dl-links__sep">·</span>
          <a href="https://github.com/sganggs/Stronghold-Protocol" target="_blank" rel="noopener noreferrer">主仓库</a>
        </p>
      </div>

      <div class="title-login servers-panel admin-panel" id="ad-gate-login">
        <p class="dl-note" style="margin:0 0 .12rem">管理页面需要密钥。</p>
        <form id="ad-key-form" autocomplete="off">
          <label class="admin-field">
            <span class="micro">密钥</span>
            <input id="ad-key-input" type="password" placeholder="输入管理密钥" required />
          </label>
          <p class="admin-err" id="ad-key-err" hidden></p>
          <div class="admin-actions">
            <button type="submit" class="btn btn--primary btn--sm" id="ad-key-go"><span class="btn__label">进入管理</span></button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="./js/admin.js?v=11" defer></script>
</body>
</html>
