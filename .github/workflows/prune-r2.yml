name: prune-r2

# 定时清理 R2 上「已经没人引用」的安装包（.apk）与热更新包（content-slim-*.zip）。
#
# 背景：每次构建 APK ~600-750 MB、slim ~13 MB，R2 免费额度 10 GB，几版就顶到天花板（10-04 到过 10.7 GB）。
# 判定逻辑全在 tools/prune-r2.mjs 里：保留「指针指向的 + 清单引用的 + 每条线最新 N 个」，
# 其余超过 age_hours（默认 12h）未引用的清掉；永不碰 latest*.json 与 apk/ 之外的前缀。
# 本地干跑与 CI 跑的是同一份实现，不会漂移。
#
# 旧版本只认 `stronghold-vX.Y.Z.apk` 一种命名，而线上有四种 APK 命名 + 一种 slim 命名，
# 实测一个都不匹配 —— 每小时"成功"地什么都没删。
#
# 手动触发默认**干跑**（只看会删什么）；定时触发按 apply 真删。

on:
  schedule:
    - cron: '17 * * * *' # hourly
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run = 只打印；apply = 真删'
        required: false
        default: 'dry-run'
        type: choice
        options: ['dry-run', 'apply']
      keep:
        description: '每条命名线保留最新的几个'
        required: false
        default: '1'
      age_hours:
        description: '超过多少小时的未引用对象就清掉'
        required: false
        default: '12'

permissions:
  contents: read

concurrency:
  group: prune-r2
  cancel-in-progress: false

env:
  R2_BUCKET: stronghold-assets
  R2_ENDPOINT: https://8641802a2d46497f1cc4e7a4cba365d2.r2.cloudflarestorage.com

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prune stale APKs and hot-update slims
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          KEEP: ${{ github.event.inputs.keep || '1' }}
          AGE: ${{ github.event.inputs.age_hours || '12' }}
          MODE: ${{ github.event.inputs.mode || 'apply' }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCESS_KEY" && test -n "$R2_SECRET_KEY" || { echo "R2 secrets absent"; exit 1; }
          # 定时触发没有 inputs → MODE 为空 → 取 apply；手动触发按选择的 mode 走。
          args="--keep=$KEEP --age-hours=$AGE"
          if [ "$MODE" = "apply" ]; then args="$args --apply"; fi
          echo "running: node tools/prune-r2.mjs $args"
          node tools/prune-r2.mjs $args
