name: mirror-apk

# 2026-10-24 起本任务只剩一件事：每次发布把「玩家向更新日志」写进 D1（site_blob 表的
# site/changelog.json 键），供 GET /api/latest 的 _changelog 字段读取。
#
# 历史：本任务原是「把当前 release 的 APK 逐字节镜像到 R2 首方 CDN（weishucdn.jiangjiangze.icu）」，
# 后来下载链改走 GitHub + 公共加速器竞速（functions/api/download/[[path]].js 已不读 R2 的 apk/ 键），
# 2026-10-24 R2 在账号层被禁用（CF API 10042），APK 镜像与 prune 链彻底无家可归，一并下线。
# 站点 Functions 的存储也已从 R2 迁到 D1（functions/_store.js），所以日志改用 wrangler d1 写入。
#
# 需要 secrets：CLOUDFLARE_API_TOKEN（D1:Edit）、CLOUDFLARE_ACCOUNT_ID —— 与 deploy-pages 同一对。

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Force a release tag (default: newest stable release with an APK)'
        required: false

permissions:
  contents: read

concurrency:
  group: mirror-apk
  cancel-in-progress: false

env:
  SRC_REPO: jingjiangze/Stronghold-Protocol
  APK_NAME: app-release.apk

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this repo (for tools/changelog.mjs)
        uses: actions/checkout@v7

      - name: Resolve the release to mirror
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            meta=$(gh api "repos/$SRC_REPO/releases/tags/$WANT" \
              --jq '{tag: .tag_name, apk: ([.assets[] | select(.name=="'$APK_NAME'")] | first)} | select(.apk != null)')
          else
            meta=$(gh api "repos/$SRC_REPO/releases?per_page=10" --jq \
              '[.[] | select(.draft == false and .prerelease == false)
                    | {tag: .tag_name, apk: ([.assets[] | select(.name == "'"$APK_NAME"'")] | first)}]
               | map(select(.apk != null)) | first')
          fi
          test -n "$meta" || { echo "no stable release with $APK_NAME found"; exit 1; }
          tag=$(echo "$meta" | jq -r .tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: $tag ($(echo "$meta" | jq -r .apk.size) bytes)"

      - name: Publish the player-facing changelog
        # 每轮都跑：日志和（已下线的）字节上传是两件事；发布节奏由 tag 变化自然去重
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          node tools/changelog.mjs --tag "$TAG" --out changelog.json
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN absent — 只打印日志，不写 D1"
            cat changelog.json
            exit 0
          fi
          node tools/d1-put-blob.mjs site/changelog.json changelog.json
          {
            echo "## changelog: $(node -e 'const j=require("./changelog.json");console.log(j.version+" · "+j.items.length+" 条")')"
            node -e 'require("./changelog.json").items.forEach(i=>console.log("- "+(i.pr?"PR#"+i.pr+" ":"")+i.text))'
          } >> "$GITHUB_STEP_SUMMARY"
