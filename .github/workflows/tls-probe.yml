name: tls-probe

# 证书旁路探针：Cloudflare 的 fetch 没有"忽略证书"开关，源站自签（SakuraFrp 之类的隧道给的
# 自动证书）时边缘只能拿到 525/526，服务器明明活着、玩家进得去，站点却永远看不见。
# 这一链在 GitHub Runner 上跑（Node 可以对单个请求关掉校验），只有读到**完整协议指纹**
# 才写进 site/probes.json，站点侧 readProbeReports() 据此放行并记 attested_by:'tls-probe'。
#
# 密钥边界：这个 job 只拿 CLOUDFLARE_API_TOKEN 写 D1 的 site_blob（2026-10-24 起 R2 已在
# 账号层禁用，清单/探针数据的真源搬进 D1 site_blob 表，键名沿用原 R2 对象键），
# 没有 PUBLISH_KEY、没有任何签名私钥 —— 它能做的是"提供证据"，拍板仍在站点自己的函数里。
#
# 频率：每 2 小时一轮。站点侧报告 12 小时过期，所以最坏情况下报告会在一轮里续上；
# 免费版 Actions 分钟数有限（本仓每月 2000 分钟），这一条大约占 100 分钟。

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '只复查这一条地址（留空 = 按站点侧的失效清单与待复核清单跑）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tls-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull the list, the partition and the recheck manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN absent"; exit 1; }
          mkdir -p _probe
          for f in servers.json verified.json probes.json recheck.json; do
            if node tools/d1-get-blob.mjs "site/$f" "_probe/$f"; then
              echo "got $f ($(stat -c %s "_probe/$f") bytes)"
            else
              echo "no $f yet"
              rm -f "_probe/$f"
            fi
          done

      - name: Probe with certificate bypass
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          ARGS=(--dir _probe --max 60)
          [ -n "$ONLY" ] && ARGS+=(--only "$ONLY")
          node tools/tls-probe.mjs "${ARGS[@]}" | tee _probe/run.log

      - name: Publish the reports back to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -s _probe/probes.json || { echo "没有生成报告"; exit 1; }
          node tools/d1-put-blob.mjs site/probes.json _probe/probes.json

      - name: Drop the recheck items this run confirmed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # 探针确认过的地址就从待复核清单里摘掉（没确认的留着下轮再试），别让它无限堆
          if [ -s _probe/recheck.json ]; then
            node tools/d1-put-blob.mjs site/recheck.json _probe/recheck.json
            echo "待复核清单已回收"
          fi
