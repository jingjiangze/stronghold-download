name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true lets the workflow switch the repo's Pages source to
      # "GitHub Actions" itself, so no manual Settings click is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Trim artifact (the site is the repo root)
        run: rm -rf .git .github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
