<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>arknights 管理台 · 仅魔搭游戏服</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --amber:#d29922; --green:#3fb950; --red:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 "Segoe UI",system-ui,sans-serif; }
  main { max-width:980px; margin:0 auto; padding:22px 16px 60px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:18px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .panel h2 { font-size:14px; margin:0 0 10px; color:var(--amber); font-weight:600; }
  .kv { display:grid; grid-template-columns:180px 1fr; gap:4px 10px; font-variant-numeric:tabular-nums; }
  .kv .k { color:var(--dim); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type=password], input[type=text], textarea { width:100%; background:#0b0f14; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:13px/1.5 inherit; }
  textarea { min-height:280px; font-family:ui-monospace,Consolas,monospace; }
  button { background:#21262d; color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--dim); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.warn { background:#8e2a25; border-color:#c8392e; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .note { color:var(--dim); font-size:12px; }
  .ok { color:var(--green); } .bad { color:var(--red); }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  .tag { font-size:11px; border:1px solid var(--line); border-radius:99px; padding:1px 8px; color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>arknights 管理台 <span class="tag">仅魔搭（ModelScope）游戏服</span></h1>
  <div class="sub">范围：只读这台创空间游戏服的数据与它拉取的公告；不含其它服务器。接口都要 <code>Bearer</code> 令牌（INGEST_TOKEN）。</div>

  <div class="panel">
    <h2>令牌</h2>
    <div class="row">
      <input id="token" type="password" placeholder="INGEST_TOKEN（只存在本浏览器 localStorage）" autocomplete="off">
      <button id="save">保存并刷新</button>
      <button id="forget">清除</button>
    </div>
    <div class="hint" id="tokenHint"></div>
  </div>

  <div class="panel">
    <h2>游戏服状态（魔搭创空间）</h2>
    <div class="kv" id="status">加载中…</div>
    <div class="row" style="margin-top:10px">
      <button id="refresh">刷新</button>
      <button id="redeploy" class="warn">一键重新部署</button>
      <span class="note" id="deployNote">占用不为 0 时会拒绝（重建会清空对局，2–4 分钟）。</span>
    </div>
    <div class="hint" id="deployHint"></div>
    <hr>
    <div class="row">
      <label class="row" style="gap:6px"><input type="checkbox" id="hotMods"> 工坊热装载（hotMods）</label>
      <button id="saveSettings">写入开关</button>
      <span class="note" id="settingsHint"></span>
    </div>
  </div>

  <div class="panel">
    <h2>公告板（游戏服每 60 秒拉取这一份）</h2>
    <div class="note">公开读：<code id="annUrl"></code> — 数组，元素 { title, date?, paragraphs[], level? }，最多 50 条。</div>
    <div class="row" style="margin:10px 0">
      <button id="loadAnn">读取当前</button>
      <button id="saveAnn" class="primary">保存（整体替换）</button>
      <span class="note" id="annHint"></span>
    </div>
    <textarea id="ann" spellcheck="false" placeholder='[
  { "title": "维护公告", "date": "2026-10-13", "paragraphs": ["今晚 23:00 起维护。"], "level": "info" }
]'></textarea>
  </div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { token: localStorage.getItem('arkadmin.token') || '' };
  $('token').value = state.token;
  $('annUrl').textContent = location.origin + '/api/announcements/game';

  const headers = () => ({ 'authorization': 'Bearer ' + state.token, 'content-type': 'application/json' });
  const authHeaders = () => ({ 'authorization': 'Bearer ' + state.token });
  const show = (el, text, cls) => { el.className = cls || ''; el.textContent = text || ''; };

  function saveToken() {
    state.token = $('token').value.trim();
    if (state.token) localStorage.setItem('arkadmin.token', state.token); else localStorage.removeItem('arkadmin.token');
    show($('tokenHint'), state.token ? '已保存在本浏览器。' : '已清除。');
  }
  $('save').onclick = () => { saveToken(); refreshStatus(); };
  $('forget').onclick = () => { $('token').value = ''; saveToken(); };

  async function refreshStatus() {
    const box = $('status');
    if (!state.token) { box.textContent = '先填令牌。'; return; }
    box.textContent = '加载中…';
    try {
      const r = await fetch('/api/game/status', { headers: authHeaders() });
      const j = await r.json();
      if (!r.ok) { box.innerHTML = '<span class="bad">' + (j.error || r.status) + '</span>'; return; }
      const h = j.health || {}, d = j.deploy || {}, p = (h.performance || {}).process || {}, m = (h.performance || {}).mainThread || {};
      const rows = [
        ['app / build', (h.app || '?') + ' / ' + (h.build || '?')],
        ['运行时长', h.uptimeSec != null ? Math.round(h.uptimeSec / 60) + ' 分钟' : '—'],
        ['占用 rooms/humans/matches', [h.rooms, h.humans, h.matches].map(v => v == null ? '?' : v).join(' / ')],
        ['process cpu / rss', (p.cpu?.percent != null ? p.cpu.percent.toFixed(2) + '%' : '—') + ' / ' + (p.rssBytes != null ? (p.rssBytes / 1048576).toFixed(0) + ' MiB' : '—')],
        ['event loop p95', m.eventLoopDelayMs?.p95 != null ? m.eventLoopDelayMs.p95.toFixed(1) + ' ms' : '—'],
        ['部署提交 current / deployed', (d.current || '—') + ' / ' + (d.deployed || '—') + (d.changed ? '  ⇦ 有变更' : '')],
      ];
      box.innerHTML = rows.map(([k, v]) => `<div class="k">${k}</div><div>${v}</div>`).join('');
      if (j.error) box.insertAdjacentHTML('beforeend', `<div class="k">错误</div><div class="bad">${j.error}</div>`);
    } catch (e) { box.innerHTML = '<span class="bad">请求失败: ' + e.message + '</span>'; }
  }
  $('refresh').onclick = refreshStatus;

  $('redeploy').onclick = async () => {
    if (!confirm('确认触发魔搭重建？场上无对局时才会执行（2–4 分钟）。')) return;
    $('redeploy').disabled = true; show($('deployHint'), '触发中…');
    try {
      const r = await fetch('/api/game/redeploy', { method: 'POST', headers: authHeaders() });
      const j = await r.json();
      show($('deployHint'), j.ok ? j.message : ('失败: ' + (j.error || r.status) + (j.busy ? ' — 占用 ' + JSON.stringify(j.busy) : '')), j.ok ? 'ok' : 'bad');
      if (j.ok) setTimeout(refreshStatus, 20000);
    } catch (e) { show($('deployHint'), '请求失败: ' + e.message, 'bad'); }
    finally { $('redeploy').disabled = false; }
  };

  async function loadSettings() {
    try { const r = await fetch('/api/settings/game'); const j = await r.json(); $('hotMods').checked = j.hotMods === true; show($('settingsHint'), j.updatedAt ? ('更新于 ' + j.updatedAt + ' by ' + (j.updatedBy || '?')) : ''); } catch { /* ignore */ }
  }
  $('saveSettings').onclick = async () => {
    try {
      const r = await fetch('/api/settings/game', { method: 'PUT', headers: headers(), body: JSON.stringify({ hotMods: $('hotMods').checked }) });
      const j = await r.json();
      show($('settingsHint'), r.ok ? '已写入' : ('失败: ' + (j.error || r.status)), r.ok ? 'ok' : 'bad');
    } catch (e) { show($('settingsHint'), '请求失败: ' + e.message, 'bad'); }
  };

  async function loadAnn() {
    try {
      const r = await fetch('/api/announcements/game/admin', { headers: authHeaders() });
      const j = await r.json();
      if (!r.ok) { show($('annHint'), '失败: ' + (j.error || r.status), 'bad'); return; }
      $('ann').value = JSON.stringify(j.entries || [], null, 2);
      show($('annHint'), (j.count || 0) + ' 条' + (j.updatedAt ? '，更新于 ' + j.updatedAt : ''));
    } catch (e) { show($('annHint'), '请求失败: ' + e.message, 'bad'); }
  }
  $('loadAnn').onclick = loadAnn;
  $('saveAnn').onclick = async () => {
    let parsed; try { parsed = JSON.parse($('ann').value); } catch { show($('annHint'), '不是合法 JSON', 'bad'); return; }
    try {
      const r = await fetch('/api/announcements/game/admin', { method: 'PUT', headers: headers(), body: JSON.stringify(parsed) });
      const j = await r.json();
      show($('annHint'), r.ok ? ('已保存 ' + j.count + ' 条，游戏服 60 秒内生效') : ('失败: ' + (j.error || r.status)), r.ok ? 'ok' : 'bad');
    } catch (e) { show($('annHint'), '请求失败: ' + e.message, 'bad'); }
  };

  if (state.token) { refreshStatus(); loadSettings(); loadAnn(); } else show($('tokenHint'), '填 INGEST_TOKEN 后可用。');
})();
</script>
</body>
</html>
